# Sealfleet — one-command local stack.
#
#   docker compose up --build
#
# Brings up Postgres + (auto) keys/migrations/seeds + registry + deploy + router +
# portal + a live demo MCP. Open the portal at http://localhost:3004 and log in as
# admin@sealfleet.io with ADMIN_INITIAL_PASSWORD (default "admin" — change it below).
# The runtime API is http://localhost:8040 . A seeded local-dev operator API key is
# created (see scripts/001_create_api_keys.sql); connect your own IdP (OIDC) and
# design roles/permissions in the portal: Admin → Tenants.
#
# Auth keys (RS256 signing keys, NextAuth secret, encryption key) are generated
# once by the `keygen` service into the sealfleet_keys volume and reused on every
# restart, so sessions and portal↔router trust survive container/host restarts.
#
# This is a LOCAL/DEV launch. For production set strong secrets (DB password,
# ADMIN_INITIAL_PASSWORD, your own keys), enable TLS (see k8s/tls/), and use real
# Postgres.

name: mcpfinder

x-db-url: &db_url "postgresql://admin:admin@db:5432/mcpfinder"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: mcpfinder
    ports:
      - "54323:5432"          # host:container — change if 54323 is taken
    volumes:
      - mcpfinder_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d mcpfinder"]
      interval: 3s
      timeout: 3s
      retries: 20

  # One-shot: generate persistent auth keys into the sealfleet_keys volume if they
  # don't exist yet. Idempotent — keys are created once and survive restarts, so
  # portal sessions and router JWT validation keep working across reboots.
  keygen:
    build: {context: ./runtime}   # reuses the router image (python + cryptography); no extra pull
    user: "0:0"                  # named volumes start root-owned; keygen fixes readable local-dev modes
    command: ["python", "/scripts/compose-keygen.py"]
    volumes:
      - ./scripts:/scripts:ro
      - sealfleet_keys:/keys
    restart: "no"

  # One-shot: apply all migrations + seeds, then exit. Idempotent (IF NOT EXISTS).
  # Also bootstraps the first admin login: sets the seeded admin user's password to
  # ADMIN_INITIAL_PASSWORD only if no password is set yet (never overwrites).
  migrate:
    image: postgres:16-alpine
    depends_on:
      db: {condition: service_healthy}
      keygen: {condition: service_completed_successfully}
    environment:
      PGPASSWORD: admin
      # First-login password for admin@sealfleet.io. CHANGE THIS for any
      # deployment reachable by others; rotate via the portal after first login.
      ADMIN_INITIAL_PASSWORD: "admin"
    volumes:
      - ./db:/db:ro
      - ./scripts:/scripts:ro
      - sealfleet_keys:/keys:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        for f in /db/migrations/*.sql; do echo "migrate: $$f"; psql -h db -U admin -d mcpfinder -v ON_ERROR_STOP=1 -f "$$f"; done
        for f in /db/seeds/*.sql /scripts/001_create_api_keys.sql; do echo "seed: $$f"; psql -h db -U admin -d mcpfinder -f "$$f"; done
        # Seed the local-dev operator key from the per-deployment value keygen
        # generated (never a hardcoded key). The portal reads the same file.
        RUNTIME_API_KEY="$$(cat /keys/runtime-api-key)"
        psql -h db -U admin -d mcpfinder -v ON_ERROR_STOP=1 \
          -c "INSERT INTO api_keys (api_key, tenant_id, name, is_active, action_permissions, allow_identity_delegation) VALUES ('$${RUNTIME_API_KEY}', 'local-dev', 'Local Development Key', true, ARRAY['pipeline.invoke','agent.invoke','agent.register','mcp.server.register','registry.export','registry.import'], true) ON CONFLICT (api_key) DO UPDATE SET action_permissions = EXCLUDED.action_permissions, allow_identity_delegation = EXCLUDED.allow_identity_delegation, is_active = true;"
        if [ -n "$${ADMIN_INITIAL_PASSWORD}" ]; then
          psql -h db -U admin -d mcpfinder -v ON_ERROR_STOP=1 \
            -c "CREATE EXTENSION IF NOT EXISTS pgcrypto;" \
            -c "UPDATE users SET password_hash = crypt(\$$mfpw\$$$${ADMIN_INITIAL_PASSWORD}\$$mfpw\$$, gen_salt('bf', 10)) WHERE email = 'admin@sealfleet.io' AND password_hash IS NULL;"
        fi
        echo "migrations + seeds complete"
    restart: "no"

  registry:
    build: {context: ./registry}
    restart: unless-stopped
    depends_on:
      migrate: {condition: service_completed_successfully}
    environment:
      DATABASE_URL: *db_url
    ports: ["8010:8010"]
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:8010/health')\""]
      interval: 5s
      timeout: 3s
      retries: 20

  deploy:
    build: {context: ./deploy}
    restart: unless-stopped
    depends_on:
      migrate: {condition: service_completed_successfully}
      registry: {condition: service_started}
    environment:
      DATABASE_URL: *db_url
      REGISTRY_URL: "http://registry:8010"
    ports: ["8030:8030"]

  router:
    build: {context: ./runtime}
    restart: unless-stopped
    depends_on:
      migrate: {condition: service_completed_successfully}
      keygen: {condition: service_completed_successfully}
      registry: {condition: service_started}
    environment:
      DATABASE_URL: *db_url
      REGISTRY_URL: "http://registry:8010"
      REQUIRE_AUTH: "true"
      # Where to fetch the portal's JWKS for user-JWT validation.
      PORTAL_URL: "http://portal:3004"
      # Deploy service, reached by the MCP control server's mcp_deploy /
      # mcp_deployments tools (POST /mcp).
      DEPLOY_URL: "http://deploy:8030"
    volumes:
      - sealfleet_keys:/keys:ro
      # Pipelines authored at runtime (chat / POST /v2/pipelines/deploy). Shipped
      # example pipelines stay in the image; this keeps the authored ones across
      # `docker compose up --build`.
      - sealfleet_pipelines:/data/pipelines
    # Load persistent signing/encryption keys generated by `keygen`, then start
    # the normal entrypoint. Persistent keys (vs ephemeral) keep issued tokens
    # and encrypted-at-rest data valid across restarts.
    command:
      - /bin/sh
      - -c
      - |
        export ROUTER_RS256_PRIVATE_KEY="$$(cat /keys/router-rs256.pem)"
        export ENCRYPTION_KEY="$$(cat /keys/encryption-key)"
        exec ./entrypoint.sh
    ports: ["8040:8040"]
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:8040/health')\""]
      interval: 5s
      timeout: 3s
      retries: 20

  portal:
    build: {context: ./portal}
    restart: unless-stopped
    depends_on:
      router: {condition: service_started}
      keygen: {condition: service_completed_successfully}
    environment:
      DATABASE_URL: *db_url
      RUNTIME_URL: "http://router:8040"
      REGISTRY_URL: "http://registry:8010"
      DEPLOY_URL: "http://deploy:8030"
      AGENT_URL: "http://core-agent:8050"
      NODE_ENV: "production"
      # Browser-visible base URL — used for session callbacks and to build the
      # OIDC redirect_uri handed to your IdP. Change if you remap the port.
      NEXTAUTH_URL: "http://localhost:3004"
      AUTH_URL: "http://localhost:3004"
      # Server key the portal presents when proxying to the router is read at boot
      # from the per-deployment key keygen generated (see command below) — never
      # hardcoded. It carries allow_identity_delegation so the router attributes
      # calls (and audit rows) to the actual logged-in user and tenant.
    volumes:
      - sealfleet_keys:/keys:ro
    # Load the persistent RS256 signing key + NextAuth secret generated by
    # `keygen` (the portal refuses ephemeral keys under NODE_ENV=production),
    # then start the standalone Next.js server.
    command:
      - /bin/sh
      - -c
      - |
        export NEXTAUTH_RS256_PRIVATE_KEY="$$(cat /keys/portal-rs256.pem)"
        export NEXTAUTH_SECRET="$$(cat /keys/nextauth-secret)"
        export RUNTIME_API_KEY="$$(cat /keys/runtime-api-key)"
        exec node server.js
    ports: ["3004:3004"]
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3004/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 20

  # Single LLM entry point for the whole platform (OpenAI-compatible, port 3456).
  # Routes to: local NIM (model prefixed "local/"), then Claude OAuth / AI Gateway
  # / Anthropic key. Pure Node built-ins — no build step, no dependencies.
  llm-proxy:
    image: node:22-alpine
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./runtime/llm-proxy:/app:ro
    command: ["node", "index.js"]
    environment:
      LLM_PROXY_PORT: "3456"
      # Local on-box model (see the `local-llm` profile below, or point at your
      # own OpenAI-compatible server). Requests whose model starts with "local/"
      # are pinned here and never egress.
      LOCAL_LLM_BASE_URL: "${LOCAL_LLM_BASE_URL:-http://local-llm:8000/v1}"
      LOCAL_LLM_MODEL: "${LOCAL_LLM_MODEL:-nvidia/nemotron-3-nano-omni-30b-a3b-reasoning}"
      # Cloud fallbacks — all optional; set what you use.
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      AI_GATEWAY_API_KEY: "${AI_GATEWAY_API_KEY:-}"
      CLAUDE_CODE_OAUTH_TOKEN: "${CLAUDE_CODE_OAUTH_TOKEN:-}"
    ports: ["3456:3456"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3456/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  # LLM-powered chat agent backing the portal's /ask page. Maps a natural
  # language question to a pipeline, runs it via the router, formats the answer.
  core-agent:
    build: {context: ./agent}
    restart: unless-stopped
    depends_on:
      router: {condition: service_healthy}
      keygen: {condition: service_completed_successfully}
      llm-proxy: {condition: service_started}
    environment:
      ROUTER_URL: "http://router:8040"
      OPENAI_BASE_URL: "http://llm-proxy:3456/v1"
      OPENAI_MODEL: "${CHAT_MODEL:-anthropic/claude-sonnet-4-6}"
      LLM_TIMEOUT: "${LLM_TIMEOUT:-8}"
    volumes:
      - mcpfinder_keys:/keys:ro
    # The router requires auth; present the same per-deployment operator key the
    # migrate step seeded (grants pipeline.invoke / agent.invoke, nothing more).
    command:
      - /bin/sh
      - -c
      - |
        export ROUTER_API_KEY="$$(cat /keys/runtime-api-key)"
        exec uvicorn server:app --host 0.0.0.0 --port 8050
    ports: ["8050:8050"]
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:8050/health')\""]
      interval: 10s
      timeout: 5s
      retries: 20

  # On-box NVIDIA NIM. Opt-in: `docker compose --profile local-llm up`.
  # Requires an NVIDIA GPU + container toolkit and NGC_API_KEY. First start
  # downloads/compiles the engine and can take ~10-30 min; the ~/.cache/nim
  # mount makes later starts fast.
  local-llm:
    image: "${LOCAL_NIM_IMAGE:-nvcr.io/nim/nvidia/nemotron-3-nano-omni-30b-a3b-reasoning:latest}"
    profiles: ["local-llm"]
    restart: unless-stopped
    gpus: all
    shm_size: "32gb"
    environment:
      NGC_API_KEY: "${NGC_API_KEY:-}"
    volumes:
      - "${LOCAL_NIM_CACHE:-${HOME}/.cache/nim}:/opt/nim/.cache"
    ports: ["127.0.0.1:8000:8000"]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/v1/models >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 60
      start_period: 30m

  # Live demo MCP so the catalog has an invocable tool out of the box (fake data
  # only — see mcps/demo_sandbox). The network alias matches the endpoint in
  # runtime/manifests/demo-sandbox-mcp.yaml, which k8s deployments also use.
  demo-sandbox-mcp:
    build: {context: ./runtime}
    restart: unless-stopped
    working_dir: /workspace
    volumes:
      - ./mcps:/workspace/mcps:ro
    command: ["python", "-m", "uvicorn", "mcps.demo_sandbox.main:app", "--host", "0.0.0.0", "--port", "8080"]
    networks:
      default:
        aliases:
          - demo-sandbox-mcp.demo-sandbox.svc.cluster.local
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:8080/health')\""]
      interval: 5s
      timeout: 3s
      retries: 20

  # Public example MCP: weather trip planner (real key-less weather data via
  # Open-Meteo with a met.no fallback). Backs the portal's /weather-trip page —
  # the reference example for "run a pipeline, then visualize the results".
  # Service name matches the endpoint in runtime/manifests/weather-trip-mcp.yaml.
  weather-trip-mcp:
    build: {context: ./runtime}
    restart: unless-stopped
    working_dir: /workspace
    volumes:
      - ./mcps:/workspace/mcps:ro
    command: ["python", "-m", "uvicorn", "mcps.weather_trip.main:app", "--host", "0.0.0.0", "--port", "8080"]
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:8080/health')\""]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  sealfleet_pipelines:
  mcpfinder_pgdata:
  sealfleet_keys:
