{{- if .Values.router.enabled }}
{{- $name := include "mcpfinder.componentName" (dict "ctx" . "component" "router") }}
{{- $registry := include "mcpfinder.componentName" (dict "ctx" . "component" "registry") }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "mcpfinder.labels" . | nindent 4 }}
    app.kubernetes.io/component: router
    app: {{ $name }}
spec:
  replicas: {{ .Values.router.replicas }}
  selector:
    matchLabels:
      {{- include "mcpfinder.selectorLabels" (dict "ctx" . "component" "router") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "mcpfinder.selectorLabels" (dict "ctx" . "component" "router") | nindent 8 }}
        part-of: mcpfinder
    spec:
      {{- if .Values.rbac.create }}
      serviceAccountName: {{ $name }}-sa
      {{- end }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- if .Values.router.persistence.enabled }}
      volumes:
        - name: pipelines
          persistentVolumeClaim:
            claimName: {{ $name }}-pipelines
      {{- end }}
      containers:
        - name: router
          image: {{ include "mcpfinder.image" (dict "ctx" . "svc" .Values.router) | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          ports:
            - containerPort: {{ .Values.router.port }}
          {{- if .Values.router.persistence.enabled }}
          volumeMounts:
            - name: pipelines
              mountPath: {{ .Values.router.persistence.mountPath }}
          {{- end }}
          env:
            {{- if .Values.router.persistence.enabled }}
            - name: PIPELINES_DATA_DIR
              value: {{ .Values.router.persistence.mountPath | quote }}
            {{- end }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "mcpfinder.secretName" . }}
                  key: DATABASE_URL
            - name: ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "mcpfinder.secretName" . }}
                  key: ENCRYPTION_KEY
            - name: ROUTER_RS256_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "mcpfinder.secretName" . }}
                  key: ROUTER_RS256_PRIVATE_KEY
            - name: REGISTRY_URL
              value: "http://{{ $registry }}:{{ .Values.registry.port }}"
            {{- if .Values.deploy.enabled }}
            - name: DEPLOY_URL
              value: "http://{{ include "mcpfinder.componentName" (dict "ctx" . "component" "deploy") }}:{{ .Values.deploy.port }}"
            {{- end }}
            - name: REQUIRE_AUTH
              value: {{ .Values.router.requireAuth | quote }}
            - name: AUTH_ALLOW_EPHEMERAL_KEYS
              value: {{ .Values.router.allowEphemeralKeys | quote }}
            {{- if .Values.licensing.publicKey }}
            - name: SEALFLEET_LICENSE_PUBKEY
              value: {{ .Values.licensing.publicKey | quote }}
            {{- end }}
            {{- if .Values.licensing.publicKeys }}
            - name: SEALFLEET_LICENSE_PUBKEYS
              value: {{ .Values.licensing.publicKeys | quote }}
            {{- end }}
            {{- if .Values.licensing.licenseKey }}
            - name: SEALFLEET_LICENSE_KEY
              value: {{ .Values.licensing.licenseKey | quote }}
            {{- end }}
            {{- if .Values.licensing.revokedIds }}
            - name: SEALFLEET_LICENSE_REVOKED
              value: {{ .Values.licensing.revokedIds | quote }}
            {{- end }}
            {{- if .Values.licensing.awsMarketplaceProductCode }}
            - name: SEALFLEET_AWS_MARKETPLACE_PRODUCT_CODE
              value: {{ .Values.licensing.awsMarketplaceProductCode | quote }}
            {{- end }}
            {{- range $k, $v := .Values.router.extraEnv }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
          readinessProbe:
            httpGet: { path: /ready, port: {{ .Values.router.port }} }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: {{ .Values.router.port }} }
            initialDelaySeconds: 15
            periodSeconds: 30
          resources:
            {{- toYaml .Values.router.resources | nindent 12 }}
{{- if .Values.router.persistence.enabled }}
---
# Pipelines authored at runtime. See router.persistence in values.yaml for the
# multi-replica caveat.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $name }}-pipelines
  labels:
    {{- include "mcpfinder.labels" . | nindent 4 }}
    app.kubernetes.io/component: router
spec:
  accessModes: [{{ .Values.router.persistence.accessMode | quote }}]
  {{- if .Values.router.persistence.storageClass }}
  storageClassName: {{ .Values.router.persistence.storageClass | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.router.persistence.size }}
{{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "mcpfinder.labels" . | nindent 4 }}
    app.kubernetes.io/component: router
    app: {{ $name }}
spec:
  type: ClusterIP
  selector:
    {{- include "mcpfinder.selectorLabels" (dict "ctx" . "component" "router") | nindent 4 }}
  ports:
    - port: {{ .Values.router.port }}
      targetPort: {{ .Values.router.port }}
      name: http
{{- end }}
